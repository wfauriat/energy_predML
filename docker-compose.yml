services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Mount mlruns at the same absolute path as on host so MLflow artifact paths resolve
      - ./mlruns:${HOST_PROJECT_ROOT}/mlruns
    environment:
      - MLFLOW_TRACKING_URI=${HOST_PROJECT_ROOT}/mlruns
    depends_on:
      - mlflow

  mlflow:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:${HOST_PROJECT_ROOT}/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${HOST_PROJECT_ROOT}/mlruns
      --default-artifact-root ${HOST_PROJECT_ROOT}/mlruns

  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./mlruns:${HOST_PROJECT_ROOT}/mlruns
      - ./streamlit_app:/app/streamlit_app
    command: >
      streamlit run streamlit_app/app.py
      --server.port 8501
      --server.address 0.0.0.0
    depends_on:
      - api
